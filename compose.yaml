name: newsroom

# Local-first stack. The default profile is CPU-only and needs no API keys:
# api + panel + demo-worker + postgres + searxng + mailpit + ollama.
# `--profile gpu` adds the real Qwen/faster-whisper workers and GPU access;
# `--profile n8n` adds the optional n8n trigger backend.
#
# The panel container proxies /panel, /webhook, /tts, /subtitles, /remotion,
# /radar, /monitor and /approval to the API, so the browser always talks to one
# origin and the gateway keeps the only session/CSRF boundary.
#
# Security defaults: only the API and panel publish ports, and they bind
# to NEWSROOM_BIND (127.0.0.1 by default) instead of every interface. Postgres,
# Ollama, SearXNG, Mailpit and n8n stay on the internal network; when you really
# need their ports for debugging, add infra/compose/compose.debug.yaml and run
#   docker compose -f compose.yaml -f infra/compose/compose.debug.yaml up
# The API keeps API_GATEWAY_HOST=0.0.0.0 inside the container network because it
# is never published directly: the panel nginx proxy reaches it over the Compose
# network while only the loopback-bound panel port is exposed to the host.

x-api-base: &api-base
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file:
    - path: ${NEWSROOM_ENV_FILE:-.env}
      required: false
  environment: &api-environment
    NODE_ENV: production
    NEWSROOM_MODE: ${NEWSROOM_MODE:-demo}
    API_GATEWAY_HOST: 0.0.0.0
    API_GATEWAY_PORT: "8099"
    DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-newsroom}:${POSTGRES_PASSWORD:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}@postgres:5432/${POSTGRES_DB:-newsroom}}
    BLOB_ROOT: /app/data/blobs
    DOCUMENT_ROOT: /app/data/documents
    API_GATEWAY_EVENTS_FILE: /app/runtime-logs/gateway-events.jsonl
    API_GATEWAY_ALLOWED_ORIGINS: ${API_GATEWAY_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    API_GATEWAY_TRUSTED_MUTATION_ORIGINS: ${API_GATEWAY_TRUSTED_MUTATION_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    PANEL_PUBLIC_ORIGIN: ${PANEL_PUBLIC_ORIGIN:-}
    API_GATEWAY_N8N_TARGET: http://n8n:5678
    PYTHON_BIN: /opt/newsroom-python/bin/python
    LLM: ${LLM:-ollama}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30s}
    NEWS_SOURCE: ${NEWS_SOURCE:-rss}
    NEWS_DISCOVERY_FEED_URL: ${NEWS_DISCOVERY_FEED_URL:-}
    NEWS_DISCOVERY_PLAYERS: ${NEWS_DISCOVERY_PLAYERS:-}
    ARTICLE_EXTRACTOR: ${ARTICLE_EXTRACTOR:-trafilatura}
    IMAGE_SEARCH: ${IMAGE_SEARCH:-searxng}
    SEARXNG_URL: http://searxng:8080
    IMAGE_SEARCH_WIKIMEDIA: ${IMAGE_SEARCH_WIKIMEDIA:-true}
    DOCUMENT_EXPORT: ${DOCUMENT_EXPORT:-local}
    MEDIA_DOWNLOAD: ${MEDIA_DOWNLOAD:-worker}
    ASR_BASE_URL: http://asr-worker:8765
    TTS_BASE_URL: ${TTS_BASE_URL:-http://tts-worker:8766}
    SUBTITLES_BASE_URL: ${SUBTITLES_BASE_URL:-http://subtitles:8092}
    RENDERER_BASE_URL: ${RENDERER_BASE_URL:-http://renderer:3042}
    RENDERER_API_KEY: ${API_GATEWAY_RENDERER_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
    RENDERER_PROFILE: ${RENDERER_PROFILE:-local}
    NOTIFY: ${NOTIFY:-console}
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    SMTP_FROM: ${SMTP_FROM:-newsroom@example.local}
    WORKFLOW: ${WORKFLOW:-disabled}
    N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL:-http://n8n:5678}
    N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
    JOBS_API_KEY: ${JOBS_API_KEY:-}
    STORAGE: ${STORAGE:-fs}
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    S3_BUCKET: ${S3_BUCKET:-newsroom}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    NEWSROOM_GPU_LOCK_PATH: /tmp/newsroom-gpu.lock
  volumes:
    - newsroom_blobs:/app/data/blobs
    - newsroom_documents:/app/data/documents
    - newsroom_runtime:/app/runtime-logs
    - newsroom_media:/app/runtime/media
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newsroom}
      POSTGRES_USER: ${POSTGRES_USER:-newsroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
    volumes:
      - newsroom_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api-base
    profiles: ["tools"]
    working_dir: /app
    command: ["node", "packages/data/scripts/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *api-base
    working_dir: /app/apps/api
    command: ["node", "scripts/seed-demo.js"]
    environment:
      <<: *api-environment
      NEWSROOM_DEMO_PASSWORD: ${NEWSROOM_DEMO_PASSWORD:-}
      NEWSROOM_DEMO_EDITOR_EMAIL: ${NEWSROOM_DEMO_EDITOR_EMAIL:-editor@example.local}
      NEWSROOM_DEMO_VIEWER_EMAIL: ${NEWSROOM_DEMO_VIEWER_EMAIL:-viewer@example.local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  demo-worker:
    build:
      context: .
      dockerfile: services/demo-worker/Dockerfile
    environment:
      DEMO_WORKER_PORT: "8088"
      DEMO_VIDEO_PATH: /app/examples/brand/final-demo.mp4
      DEMO_WORKER_API_TOKENS: ${API_GATEWAY_TTS_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets},${API_GATEWAY_SUBTITLES_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets},${API_GATEWAY_RENDERER_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
    expose:
      - "8088"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    <<: *api-base
    working_dir: /app/apps/api
    command: ["node", "src/gateway.js"]
    ports:
      - "${NEWSROOM_BIND:-127.0.0.1}:${API_GATEWAY_PORT:-8099}:8099"
    networks:
      default: {}
      panelnet: {}
    depends_on:
      postgres:
        condition: service_healthy
      demo-worker:
        condition: service_healthy
      approval-editor:
        condition: service_healthy
      searxng:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

  approval-editor:
    build:
      context: .
      dockerfile: services/approval-editor/Dockerfile
    environment:
      APPROVAL_EDITOR_RENDER_ADAPTER: ${APPROVAL_EDITOR_RENDER_ADAPTER:-http}
      APPROVAL_EDITOR_RENDERER_URL: ${APPROVAL_EDITOR_RENDERER_URL:-http://renderer:3042}
      APPROVAL_EDITOR_PYTHON_BIN: python3
      APPROVAL_EDITOR_API_TOKEN: ${API_GATEWAY_APPROVAL_SECRET:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      APPROVAL_EDITOR_RENDERER_API_KEY: ${API_GATEWAY_RENDERER_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      ASR_WORKER_URL: http://asr-worker:8765
      TRANSCRIPT_SERVICE_API_KEY: ${API_GATEWAY_RADAR_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
    expose:
      - "3042"
    volumes:
      - newsroom_approval:/app/services/approval-editor/projects
      - newsroom_renderer_editor:/app/runtime/media/renderer
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3042/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  panel:
    build:
      context: .
      dockerfile: apps/panel/Dockerfile
    ports:
      - "${NEWSROOM_BIND:-127.0.0.1}:${PANEL_PORT:-8080}:8080"
    networks:
      panelnet:
        ipv4_address: ${NEWSROOM_PANEL_IP:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.11.11-626105eec
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.2
    restart: unless-stopped

  # Offline RSS + article fixture for the local-mode end-to-end test. It is
  # never started by the product profiles: the E2E runner enables `e2e` and
  # points NEWS_DISCOVERY_FEED_URL at http://e2e-fixtures:8000/discovery.xml.
  e2e-fixtures:
    image: python:3.12-slim
    profiles: ["e2e"]
    command: ["python", "-m", "http.server", "8000", "--directory", "/srv"]
    volumes:
      - ./infra/e2e/fixtures:/srv:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/discovery.xml', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["local", "gpu"]
    # Models are downloaded by the installer / `newsroom models pull`, never
    # by the container command. keep_alive unloads the model shortly
    # after the last request so it shares the 8 GB GPU with the other workers.
    command: ["serve"]
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30s}
    volumes:
      - newsroom_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  model-init:
    build:
      context: .
      dockerfile: infra/models/Dockerfile
    profiles: ["tools"]
    environment:
      PIPER_MODEL: ${PIPER_MODEL:-es_ES-davefx-medium}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      PIPER_MODEL_DIR: /models/piper
      WHISPER_MODEL_DIR: /models/whisper
      # The GPU override switches this to qwen so the installer also downloads
      # the Qwen3-TTS checkpoint used by the GPU voice worker.
      TTS_WORKER_ENGINE: ${TTS_WORKER_ENGINE:-piper}
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      QWEN_TTS_MODEL_DIR: /models/qwen-tts
    volumes:
      - newsroom_piper_models:/models/piper
      - newsroom_whisper_models:/models/whisper
    restart: "no"

  asr-worker:
    build:
      context: .
      dockerfile: services/asr-worker/Dockerfile
    profiles: ["local", "gpu"]
    environment:
      NEWSROOM_MODE: ${NEWSROOM_MODE:-demo}
      # The worker reads TRANSCRIPT_SERVICE_* (see app/settings.py), not the
      # generic WHISPER_* names. Keep both in sync for the GPU preset.
      TRANSCRIPT_SERVICE_API_KEY: ${API_GATEWAY_RADAR_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      TRANSCRIPT_SERVICE_WHISPER_MODEL: ${WHISPER_MODEL:-small}
      TRANSCRIPT_SERVICE_WHISPER_MODEL_PATH: /models/whisper/${WHISPER_MODEL:-small}
      TRANSCRIPT_SERVICE_DEVICE: ${WHISPER_DEVICE:-cpu}
      TRANSCRIPT_SERVICE_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      TRANSCRIPT_SERVICE_MEDIA_DOWNLOAD_ROOT: /app/runtime/media
      TRANSCRIPT_SERVICE_RUNTIME_DIR: /app/runtime
      NEWSROOM_GPU_LOCK_PATH: /tmp/newsroom-gpu.lock
    volumes:
      - newsroom_whisper_models:/models/whisper
      - newsroom_gpu_lock:/tmp
      - newsroom_media:/app/runtime/media
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/radar/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  tts-worker:
    build:
      context: .
      dockerfile: services/tts-worker/Dockerfile
      args:
        TTS_EXTRAS: piper
    profiles: ["local", "gpu"]
    environment:
      NEWSROOM_MODE: ${NEWSROOM_MODE:-demo}
      TTS_WORKER_ENGINE: ${TTS_WORKER_ENGINE:-piper}
      TTS_WORKER_ALLOW_CPU_FALLBACK: ${TTS_WORKER_ALLOW_CPU_FALLBACK:-1}
      PIPER_MODEL: /models/piper/${PIPER_MODEL:-es_ES-davefx-medium}/${PIPER_MODEL:-es_ES-davefx-medium}.onnx
      TTS_WORKER_INTERNAL_TOKEN: ${TTS_WORKER_INTERNAL_TOKEN:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      # The bundled orchestrator + internal worker share one container: the
      # worker stays on loopback and the public API validates the same
      # credentials the gateway injects for the remote workers.
      TTS_WORKER_INTERNAL_URL: http://127.0.0.1:8767
      TTS_WORKER_FRONTEND_API_KEY: ${API_GATEWAY_TTS_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      TTS_WORKER_BASIC_USER: ${API_GATEWAY_TTS_BASIC_USER:-local-tts}
      TTS_WORKER_BASIC_PASS: ${API_GATEWAY_TTS_BASIC_PASS:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      TTS_WORKER_RUNTIME_DIR: /app/runtime/tts-worker
      NEWSROOM_GPU_LOCK_PATH: /tmp/newsroom-gpu.lock
    volumes:
      - newsroom_piper_models:/models/piper
      - newsroom_gpu_lock:/tmp
      - newsroom_tts:/app/runtime
    expose:
      - "8766"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  subtitles:
    build:
      context: .
      dockerfile: services/subtitles/Dockerfile
    profiles: ["local", "gpu"]
    environment:
      SUBTITLES_REMOTE_WORKSPACE_ROOT: /app/runtime/media/subtitles
      SUBTITLES_REMOTE_API_KEY: ${API_GATEWAY_SUBTITLES_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      SUBTITLES_REMOTE_BASIC_USER: ${API_GATEWAY_SUBTITLES_BASIC_USER:-local-subtitles}
      SUBTITLES_REMOTE_BASIC_PASS: ${API_GATEWAY_SUBTITLES_BASIC_PASS:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      SUBTITLES_REMOTE_HOST: 0.0.0.0
      SUBTITLES_REMOTE_PORT: "8092"
      ASR_WORKER_URL: http://asr-worker:8765
      TRANSCRIPT_SERVICE_API_KEY: ${API_GATEWAY_RADAR_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      NEWSROOM_MODE: ${NEWSROOM_MODE:-demo}
    volumes:
      - newsroom_media:/app/runtime/media
    expose:
      - "8092"
    restart: unless-stopped

  renderer:
    build:
      context: .
      dockerfile: services/renderer/Dockerfile
    profiles: ["local", "gpu"]
    environment:
      NEWSROOM_MODE: ${NEWSROOM_MODE:-demo}
      RENDERER_PROFILE: ${RENDERER_PROFILE:-local}
      RENDER_SERVER_HOST: 0.0.0.0
      RENDER_SERVER_PORT: "3042"
      RENDERER_API_KEY: ${API_GATEWAY_RENDERER_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      RENDER_OUTPUT_ROOT: /app/runtime/media/renderer
      REMOTION_HARDWARE_ACCELERATION: disable
      REMOTION_GL: swangle
    volumes:
      - newsroom_media:/app/runtime/media
      - newsroom_renderer_editor:/app/runtime/media/renderer
    expose:
      - "3042"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3042/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  channel-monitor:
    build:
      context: .
      dockerfile: services/channel-monitor/Dockerfile
    profiles: ["local", "gpu"]
    expose:
      - "8790"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/api/monitor/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.123.52
    profiles: ["n8n"]
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      N8N_DIAGNOSTICS_ENABLED: "false"
      NEWSROOM_API_URL: http://api:8099
      NEWSROOM_JOBS_TOKEN: ${JOBS_API_KEY:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}
      NEWSROOM_NOTIFY_EMAIL: ${NEWSROOM_NOTIFY_EMAIL:-editor@example.local}
    volumes:
      - newsroom_n8n:/home/node/.n8n
      - ./infra/n8n/workflows:/workflows:ro
    restart: unless-stopped

  # Optional S3-compatible storage. Enable with:
  #   STORAGE=s3 docker compose --profile s3 up -d minio api panel
  # The bucket is created by `docker compose run --rm minio-init`; the API keeps
  # serving blobs through /panel/blobs, so the browser contract does not change.
  minio:
    image: elestio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (run ./install.sh or add the s3 values to .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (run ./install.sh or add the s3 values to .env)}
    volumes:
      - newsroom_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["s3", "tools"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" && mc mb --ignore-existing local/\"$${S3_BUCKET}\""
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env (run ./install.sh or add the s3 values to .env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (run ./install.sh or add the s3 values to .env)}
      S3_BUCKET: ${S3_BUCKET:-newsroom}
    restart: "no"

networks:
  # Docker picks the default network range dynamically, so the stack never
  # collides with a network that already holds the old hard-coded subnet.
  default: {}
  # Dedicated proxy network: the panel gets a fixed address here and the API
  # trusts X-Forwarded-For only from it. ./install.sh picks a free /24 and
  # writes NEWSROOM_PANEL_SUBNET, NEWSROOM_PANEL_IP and TRUSTED_PROXY_CIDRS.
  panelnet:
    ipam:
      config:
        - subnet: ${NEWSROOM_PANEL_SUBNET:?run ./install.sh first to generate .env; docker compose up alone cannot create the required secrets}

volumes:
  newsroom_media:
  newsroom_postgres:
  newsroom_blobs:
  newsroom_documents:
  newsroom_runtime:
  newsroom_ollama:
  newsroom_piper_models:
  newsroom_whisper_models:
  newsroom_gpu_lock:
  newsroom_approval:
  newsroom_tts:
  newsroom_renderer_editor:
  newsroom_n8n:
  newsroom_minio:
