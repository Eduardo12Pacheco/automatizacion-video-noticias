name: newsroom

# Local-first stack. The default profile is CPU-only and needs no API keys:
# api + panel + demo-worker + postgres + searxng + mailpit + ollama.
# `--profile gpu` adds the real Qwen/faster-whisper workers and GPU access;
# `--profile n8n` adds the optional n8n trigger backend.
#
# The panel container proxies /panel, /webhook, /tts, /subtitles, /remotion,
# /radar, /monitor and /approval to the API, so the browser always talks to one
# origin and the gateway keeps the only session/CSRF boundary.
#
# Security defaults (S12): only the API and panel publish ports, and they bind
# to NEWSROOM_BIND (127.0.0.1 by default) instead of every interface. Postgres,
# Ollama, SearXNG, Mailpit and n8n stay on the internal network; when you really
# need their ports for debugging, add infra/compose/compose.debug.yaml and run
#   docker compose --profile debug -f compose.yaml -f infra/compose/compose.debug.yaml up
# The API keeps API_GATEWAY_HOST=0.0.0.0 inside the container network because it
# is never published directly: the panel nginx proxy reaches it over the Compose
# network while only the loopback-bound panel port is exposed to the host.

x-api-base: &api-base
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file:
    - path: ${NEWSROOM_ENV_FILE:-.env}
      required: false
  environment: &api-environment
    NODE_ENV: production
    API_GATEWAY_HOST: 0.0.0.0
    API_GATEWAY_PORT: "8099"
    DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-newsroom}:${POSTGRES_PASSWORD:?run ./install.sh first}@postgres:5432/${POSTGRES_DB:-newsroom}}
    BLOB_ROOT: /app/data/blobs
    DOCUMENT_ROOT: /app/data/documents
    API_GATEWAY_EVENTS_FILE: /app/runtime-logs/gateway-events.jsonl
    API_GATEWAY_ALLOWED_ORIGINS: ${API_GATEWAY_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    API_GATEWAY_TRUSTED_MUTATION_ORIGINS: ${API_GATEWAY_TRUSTED_MUTATION_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    PANEL_PUBLIC_ORIGIN: ${PANEL_PUBLIC_ORIGIN:-}
    API_GATEWAY_TTS_TARGET: http://demo-worker:8088
    API_GATEWAY_SUBTITLES_TARGET: http://demo-worker:8088
    API_GATEWAY_REMOTION_TARGET: http://demo-worker:8088
    API_GATEWAY_APPROVAL_TARGET: http://approval-editor:3042
    API_GATEWAY_N8N_TARGET: http://n8n:5678
    API_GATEWAY_RADAR_TARGET: http://asr-worker:8765
    API_GATEWAY_MONITOR_TARGET: http://channel-monitor:8790
    PYTHON_BIN: /opt/newsroom-python/bin/python
    LLM: ${LLM:-ollama}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    NEWS_SOURCE: ${NEWS_SOURCE:-rss}
    ARTICLE_EXTRACTOR: ${ARTICLE_EXTRACTOR:-trafilatura}
    IMAGE_SEARCH: ${IMAGE_SEARCH:-searxng}
    SEARXNG_URL: http://searxng:8080
    IMAGE_SEARCH_WIKIMEDIA: ${IMAGE_SEARCH_WIKIMEDIA:-true}
    DOCUMENT_EXPORT: ${DOCUMENT_EXPORT:-local}
    NOTIFY: ${NOTIFY:-console}
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    SMTP_FROM: ${SMTP_FROM:-newsroom@example.local}
    WORKFLOW: ${WORKFLOW:-disabled}
    N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL:-http://n8n:5678}
    NEWSROOM_GPU_LOCK_PATH: /tmp/newsroom-gpu.lock
  volumes:
    - newsroom_blobs:/app/data/blobs
    - newsroom_documents:/app/data/documents
    - newsroom_runtime:/app/runtime-logs
    - newsroom_media:/app/runtime/media
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-newsroom}
      POSTGRES_USER: ${POSTGRES_USER:-newsroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./install.sh first}
    volumes:
      - newsroom_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api-base
    profiles: ["tools"]
    working_dir: /app
    command: ["node", "packages/data/scripts/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *api-base
    working_dir: /app/apps/api
    command: ["node", "scripts/seed-demo.js"]
    environment:
      <<: *api-environment
      NEWSROOM_DEMO_PASSWORD: ${NEWSROOM_DEMO_PASSWORD:-}
      NEWSROOM_DEMO_EDITOR_EMAIL: ${NEWSROOM_DEMO_EDITOR_EMAIL:-editor@example.local}
      NEWSROOM_DEMO_VIEWER_EMAIL: ${NEWSROOM_DEMO_VIEWER_EMAIL:-viewer@example.local}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  demo-worker:
    build:
      context: .
      dockerfile: services/demo-worker/Dockerfile
    environment:
      DEMO_WORKER_PORT: "8088"
      DEMO_VIDEO_PATH: /app/examples/brand/final-demo.mp4
    expose:
      - "8088"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    <<: *api-base
    working_dir: /app/apps/api
    command: ["node", "src/gateway.js"]
    ports:
      - "${NEWSROOM_BIND:-127.0.0.1}:${API_GATEWAY_PORT:-8099}:8099"
    depends_on:
      postgres:
        condition: service_healthy
      demo-worker:
        condition: service_healthy
      approval-editor:
        condition: service_healthy
      searxng:
        condition: service_started
      mailpit:
        condition: service_started
    restart: unless-stopped

  approval-editor:
    build:
      context: .
      dockerfile: apps/panel/services/approval-editor/Dockerfile
    expose:
      - "3042"
    volumes:
      - newsroom_approval:/app/apps/panel/services/approval-editor/projects
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3042/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  panel:
    build:
      context: .
      dockerfile: apps/panel/Dockerfile
    ports:
      - "${NEWSROOM_BIND:-127.0.0.1}:${PANEL_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run ./install.sh first}
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$${OLLAMA_MODEL}" || true
        wait $$pid
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - newsroom_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  model-init:
    build:
      context: .
      dockerfile: infra/models/Dockerfile
    profiles: ["tools"]
    environment:
      PIPER_MODEL: ${PIPER_MODEL:-en_US-lessac-medium}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      PIPER_MODEL_DIR: /models/piper
      WHISPER_MODEL_DIR: /models/whisper
    volumes:
      - newsroom_piper_models:/models/piper
      - newsroom_whisper_models:/models/whisper
    restart: "no"

  asr-worker:
    build:
      context: .
      dockerfile: services/asr-worker/Dockerfile
    profiles: ["gpu"]
    environment:
      WHISPER_MODEL: /models/whisper/${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      NEWSROOM_GPU_LOCK_PATH: /tmp/newsroom-gpu.lock
      TRANSCRIPT_SERVICE_MEDIA_DOWNLOAD_ROOT: /app/runtime/media
      TRANSCRIPT_SERVICE_RUNTIME_DIR: /app/runtime
    volumes:
      - newsroom_whisper_models:/models/whisper
      - newsroom_gpu_lock:/tmp
      - newsroom_media:/app/runtime/media
    expose:
      - "8765"
    restart: unless-stopped

  tts-worker:
    build:
      context: .
      dockerfile: services/tts-worker/Dockerfile
      args:
        TTS_EXTRAS: piper
    profiles: ["gpu"]
    environment:
      TTS_WORKER_ENGINE: ${TTS_WORKER_ENGINE:-auto}
      TTS_WORKER_ALLOW_CPU_FALLBACK: ${TTS_WORKER_ALLOW_CPU_FALLBACK:-1}
      PIPER_MODEL: /models/piper/${PIPER_MODEL:-en_US-lessac-medium}/${PIPER_MODEL:-en_US-lessac-medium}.onnx
      NEWSROOM_GPU_LOCK_PATH: /tmp/newsroom-gpu.lock
    volumes:
      - newsroom_piper_models:/models/piper
      - newsroom_gpu_lock:/tmp
    expose:
      - "8766"
    restart: unless-stopped

  channel-monitor:
    build:
      context: .
      dockerfile: services/channel-monitor/Dockerfile
    profiles: ["gpu"]
    expose:
      - "8790"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.123.52
    profiles: ["n8n"]
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run ./install.sh first}
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - newsroom_n8n:/home/node/.n8n
    restart: unless-stopped

volumes:
  newsroom_media:
  newsroom_postgres:
  newsroom_blobs:
  newsroom_documents:
  newsroom_runtime:
  newsroom_ollama:
  newsroom_piper_models:
  newsroom_whisper_models:
  newsroom_gpu_lock:
  newsroom_approval:
  newsroom_n8n:
