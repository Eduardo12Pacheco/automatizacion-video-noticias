[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsroom-local-adapters"
version = "0.1.0"
description = "Trafilatura article extraction and python-docx export used by the local API adapters."
requires-python = ">=3.11"
dependencies = [
  "trafilatura>=1.8",
  "python-docx>=1.1",
  "newsroom-media",
]

[tool.uv.sources]
newsroom-media = { path = "../newsroom_media" }

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
newsroom-local-adapters = "newsroom_local_adapters.cli:main"

[tool.setuptools.packages.find]
include = ["newsroom_local_adapters*"]

[tool.pytest.ini_options]
markers = [
  "live: opt-in test that needs network access, a running local service or a downloaded model",
]
