[project]
name = "newsroom-tts-worker"
version = "0.1.0"
description = "Local TTS worker, orchestrator and legacy wrappers."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2,<3",
  "numpy>=1.26",
  "soundfile>=0.12",
  "PyYAML>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
gpu = ["qwen-tts>=0.1.1", "torch>=2.3"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
