# Fictional seed channels for the local-first demo.
#
# Every entry points at an invented demo source; no real broadcaster, person or
# channel is referenced. Operators can edit this file (or point
# CHANNEL_MONITOR_CHANNELS_CONFIG at their own copy) to monitor real channels.

countries:
  - code: aurenia
    name: Aurenia
    channels:
      - url: https://www.youtube.com/@demo-sports-aurenia
        label: Demo Sports Aurenia
        enabled: true
        important: true
        important_mode: full_channel
        priority_tier: importantes
        algorithm_priority_rank: 7
      - url: https://www.youtube.com/@demo-wire-aurenia
        label: Demo Wire Aurenia
        enabled: true
        important: true
        important_mode: program_rules
        important_rules:
          - op: starts_with
            value: DEMO SPORTS EN VIVO
          - op: contains
            value: DEMO SPORTS
      - url: https://www.youtube.com/@demo-radio-aurenia
        label: Demo Radio Aurenia
        enabled: true

  - code: montelia
    name: Montelia
    channels:
      - url: https://www.youtube.com/@demo-sports-montelia
        label: Demo Sports Montelia
        enabled: true
        important: true
        important_mode: full_channel
        priority_tier: importantes
        algorithm_priority_rank: 3
      - url: https://www.youtube.com/@demo-wire-montelia
        label: Demo Wire Montelia
        enabled: true
        important: true
        important_mode: program_rules
        important_rules:
          - op: starts_with
            value: MONTELIA EN JUEGO
        algorithm_priority_rank: 15
      - url: https://www.youtube.com/@demo-radio-montelia
        label: Radio Demo Montelia
        enabled: true

  - code: terramar
    name: Terramar
    channels:
      - url: https://www.youtube.com/@demo-sports-terramar
        label: Demo Sports Terramar
        enabled: true
        important: true
        important_mode: full_channel
        priority_tier: importantes
        algorithm_priority_rank: 21
      - url: https://www.youtube.com/@demo-wire-terramar
        label: Demo Wire Terramar
        enabled: true
        important: true
        important_mode: program_rules
        important_rules:
          - op: contains
            value: TERRAMAR AL DÍA
      - url: https://www.youtube.com/@demo-radio-terramar
        label: Radio Demo Terramar
        enabled: false
