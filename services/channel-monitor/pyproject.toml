[project]
name = "newsroom-channel-monitor"
version = "0.1.0"
description = "Local channel monitor and RSS/radar read-model backend."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.29,<1",
  "pyyaml>=6",
  "newsroom-media",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/python/newsroom_media"]
testpaths = ["tests"]

[tool.uv.sources]
newsroom-media = { path = "../../packages/python/newsroom_media" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
