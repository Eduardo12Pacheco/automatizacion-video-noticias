[project]
name = "newsroom-asr-worker"
version = "0.1.0"
description = "Local Whisper ASR worker and transcript/mention backend."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2,<3",
  "newsroom-worker-common",
  "newsroom-media",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
fetch = ["yt-dlp>=2025.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
newsroom-worker-common = { path = "../../packages/python/newsroom_worker_common" }
newsroom-media = { path = "../../packages/python/newsroom_media" }

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/python/newsroom_worker_common", "../../packages/python/newsroom_media"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
