[project]
name = "newsroom-subtitles"
version = "0.1.0"
description = "Local subtitles analysis and Remotion renderer backend."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.29,<1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
translation = ["torch>=2.3", "transformers>=4.40", "sentencepiece>=0.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
