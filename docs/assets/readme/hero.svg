<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Automatización de video para noticias</title>
  <desc id="desc">Pipeline local que convierte una noticia en un video renderizado en cinco etapas: prensa, guiones, voz, subtítulos y proyecto final, sin claves de API.</desc>

  <!-- Solid dark background so the hero reads the same on GitHub light and dark themes. -->
  <rect width="1200" height="420" rx="28" fill="#0e1116"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <rect x="72" y="72" width="56" height="56" rx="14" fill="#f5b841"/>
    <path d="M94 88 L112 100 L94 112 Z" fill="#0e1116"/>
    <text x="146" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="2" fill="#f5b841">NOTICIA → VIDEO · LOCAL</text>
    <text x="72" y="208" font-size="52" font-weight="700" fill="#e6edf3">Automatización de video</text>
    <text x="72" y="270" font-size="52" font-weight="700" fill="#e6edf3">para noticias</text>
    <text x="72" y="326" font-size="22" fill="#a9b4c2">De la fuente a un MP4 renderizado, en una sola máquina.</text>
    <text x="72" y="360" font-size="22" fill="#a9b4c2">Sin claves de API ni cuentas en la nube.</text>
  </g>

  <g id="timeline-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <rect x="792" y="56" width="360" height="308" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="820" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1" fill="#a9b4c2">LÍNEA DE TIEMPO</text>
    <text x="1124" y="100" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#f5b841">00:00:12:08</text>
    <line x1="834" y1="128" x2="834" y2="328" stroke="#30363d" stroke-width="2"/>
    <circle cx="834" cy="128" r="9" fill="#161b22" stroke="#56d4dd" stroke-width="2.5"/>
    <text x="860" y="135" font-size="22" font-weight="600" fill="#e6edf3">Prensa · descubrimiento</text>
    <circle cx="834" cy="178" r="9" fill="#161b22" stroke="#56d4dd" stroke-width="2.5"/>
    <text x="860" y="185" font-size="22" font-weight="600" fill="#e6edf3">Guiones · borrador</text>
    <circle cx="834" cy="228" r="9" fill="#161b22" stroke="#56d4dd" stroke-width="2.5"/>
    <text x="860" y="235" font-size="22" font-weight="600" fill="#e6edf3">Voz · TTS local</text>
    <circle cx="834" cy="278" r="9" fill="#161b22" stroke="#56d4dd" stroke-width="2.5"/>
    <text x="860" y="285" font-size="22" font-weight="600" fill="#e6edf3">Subtítulos · alineación</text>
    <circle cx="834" cy="328" r="9" fill="#f5b841"/>
    <text x="860" y="335" font-size="22" font-weight="600" fill="#e6edf3">Proyectos · MP4 final</text>
  </g>
</svg>
