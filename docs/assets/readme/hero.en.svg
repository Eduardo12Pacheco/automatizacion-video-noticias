<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Video automation for newsrooms</title>
  <desc id="desc">Local pipeline that turns a news story into a rendered video in five stages: discovery, scripts, voice, subtitles and the final project, with no API keys.</desc>

  <!-- Solid dark background so the hero reads the same on GitHub light and dark themes. -->
  <rect width="1200" height="420" rx="28" fill="#0e1116"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <rect x="72" y="72" width="56" height="56" rx="14" fill="#f5b841"/>
    <path d="M94 88 L112 100 L94 112 Z" fill="#0e1116"/>
    <text x="146" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="2" fill="#f5b841">NEWS → VIDEO · LOCAL</text>
    <text x="72" y="208" font-size="52" font-weight="700" fill="#e6edf3">Video automation</text>
    <text x="72" y="270" font-size="52" font-weight="700" fill="#e6edf3">for newsrooms</text>
    <text x="72" y="326" font-size="22" fill="#a9b4c2">From a news source to a rendered MP4, on one machine.</text>
    <text x="72" y="360" font-size="22" fill="#a9b4c2">No API keys and no cloud accounts.</text>
  </g>

  <g id="timeline-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <rect x="792" y="56" width="360" height="308" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="820" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.5" fill="#a9b4c2">TIMELINE</text>
    <text x="1124" y="100" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#f5b841">00:00:12:08</text>
    <line x1="834" y1="128" x2="834" y2="328" stroke="#30363d" stroke-width="2"/>
    <circle cx="834" cy="128" r="9" fill="#161b22" stroke="#56d4dd" stroke-width="2.5"/>
    <text x="860" y="135" font-size="22" font-weight="600" fill="#e6edf3">Discovery · RSS feeds</text>
    <circle cx="834" cy="178" r="9" fill="#161b22" stroke="#56d4dd" stroke-width="2.5"/>
    <text x="860" y="185" font-size="22" font-weight="600" fill="#e6edf3">Scripts · drafts</text>
    <circle cx="834" cy="228" r="9" fill="#161b22" stroke="#56d4dd" stroke-width="2.5"/>
    <text x="860" y="235" font-size="22" font-weight="600" fill="#e6edf3">Voice · local TTS</text>
    <circle cx="834" cy="278" r="9" fill="#161b22" stroke="#56d4dd" stroke-width="2.5"/>
    <text x="860" y="285" font-size="22" font-weight="600" fill="#e6edf3">Subtitles · alignment</text>
    <circle cx="834" cy="328" r="9" fill="#f5b841"/>
    <text x="860" y="335" font-size="22" font-weight="600" fill="#e6edf3">Projects · final MP4</text>
  </g>
</svg>
