# Debug-only port publishing (S12).
#
# The default stack never publishes Postgres, SearXNG, Mailpit, Ollama or n8n.
# Adding this file *is* the debug opt-in; every port still binds to
# NEWSROOM_BIND (127.0.0.1 by default):
#
#   docker compose -f compose.yaml -f infra/compose/compose.debug.yaml up -d
#
# Do not keep this file in a default `COMPOSE_FILE` list and never expose these
# ports on a shared or public network.
services:
  postgres:
    ports:
      - "${NEWSROOM_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
  searxng:
    ports:
      - "${NEWSROOM_BIND:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
  mailpit:
    ports:
      - "${NEWSROOM_BIND:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${NEWSROOM_BIND:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
  ollama:
    ports:
      - "${NEWSROOM_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
  n8n:
    ports:
      - "${NEWSROOM_BIND:-127.0.0.1}:${N8N_PORT:-5678}:5678"
