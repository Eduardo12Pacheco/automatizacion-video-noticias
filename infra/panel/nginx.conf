server {
  listen 80;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 512m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # One origin for the browser: the panel proxies every local service through
  # the API gateway, which owns sessions, CSRF and credential injection.
  location ~ ^/(panel|webhook|jobs|tts|subtitles|radar|monitor|remotion|approval)(/|$) {
    set $api_upstream http://api:8099;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
