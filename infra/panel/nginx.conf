# Preserve an HTTPS scheme supplied by a TLS terminator in front of the panel;
# fall back to this connection's own scheme. The API trusts this header only
# from the panel container, so it can mark the session cookie Secure.
map $http_x_forwarded_proto $nr_forwarded_proto {
  default $scheme;
  https https;
}

server {
  listen 8080;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 512m;

  # The panel is a private same-origin app. Inline scripts are forbidden
  # (theme bootstrap lives in js/theme-init.js); inline style attributes remain
  # allowed because the feature renderers set progress widths and cue offsets
  # as style attributes, and no external origin may supply scripts or styles.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # nginx's default MIME map does not include .mjs; browsers reject a module
  # script served as application/octet-stream.
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  # One origin for the browser: the panel proxies every local service through
  # the API gateway, which owns sessions, CSRF and credential injection.
  location ~ ^/(panel|webhook|jobs|tts|subtitles|radar|monitor|remotion|approval)(/|$) {
    set $api_upstream http://api:8099;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $nr_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (never append) so a caller cannot poison the client address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
