name: local-n8n

services:
  n8n:
    image: n8nio/n8n:1.123.52
    container_name: local-n8n
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
      - ../../examples/n8n:/import:ro

volumes:
  n8n_data:
