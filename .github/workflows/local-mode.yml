name: local-mode

# Nightly/manual real local pipeline: Ollama + Piper + faster-whisper + Remotion
# on CPU. This is intentionally separate from the fast demo CI because it
# downloads ~2.5 GB of models and renders real media.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: local-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # e2e/local-mode.spec.js measures the produced media with ffprobe/ffmpeg
      # on the runner (not inside the containers).
      - name: Install ffmpeg (ffprobe for the media assertions)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare the local-mode environment
        run: |
          cp e2e/.env.example e2e/.env.local
          sed -i \
            -e 's/^NEWSROOM_MODE=demo$/NEWSROOM_MODE=local/' \
            -e 's/^LLM=demo$/LLM=ollama/' \
            -e 's/^ARTICLE_EXTRACTOR=demo$/ARTICLE_EXTRACTOR=trafilatura/' \
            e2e/.env.local
          printf '\nCOMPOSE_PROFILES=local\n' >> e2e/.env.local
          echo "NEWSROOM_ENV_FILE=e2e/.env.local" >> "$GITHUB_ENV"
          echo "E2E_COMPOSE_ENV=e2e/.env.local" >> "$GITHUB_ENV"
      - name: Download the local models
        run: |
          docker compose --env-file e2e/.env.local --profile local run --rm model-init
          docker compose --env-file e2e/.env.local --profile local run --rm --no-deps --entrypoint /bin/ollama ollama pull qwen2.5:3b-instruct
      - name: Start the local stack
        run: |
          docker compose --env-file e2e/.env.local --profile local --profile e2e up -d --build postgres searxng mailpit demo-worker approval-editor ollama asr-worker tts-worker subtitles renderer e2e-fixtures api panel
          docker compose --env-file e2e/.env.local run --rm seed
      - name: Wait for the API and panel
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8099/panel/bootstrap >/dev/null && curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy" >&2
          docker compose ps
          exit 1
      - name: Local-mode Playwright happy path
        env:
          NEWSROOM_E2E_LOCAL: "1"
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ""
        run: pnpm exec playwright test e2e/local-mode.spec.js
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file e2e/.env.local --profile local logs --tail=500
      - name: Stop the stack
        if: always()
        run: docker compose --env-file e2e/.env.local --profile local down -v --remove-orphans
